<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Grumblebug: a grumpy dream-bee in Lumi's look: glossy soft-3D shading, lilac skin,
       violet hair-swoop fuzz, big teal eyes with lashes, pink blush. Faces left. -->
  <defs>
    <radialGradient id="body" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.35" stop-color="#FFD261"/>
      <stop offset="0.75" stop-color="#F2A93A"/><stop offset="1" stop-color="#C9741F"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7BFF"/><stop offset="0.5" stop-color="#5B47D6"/><stop offset="1" stop-color="#34248F"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#ECE8FF"/>
      <stop offset="0.85" stop-color="#C3BAEE"/><stop offset="1" stop-color="#9C90DA"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9B8FF"/><stop offset="0.45" stop-color="#7C63F2"/><stop offset="1" stop-color="#3F2BB5"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="0.6" stop-color="#D8E6FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A9C2FF" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#9FF3F0"/><stop offset="0.45" stop-color="#2CBBCB"/><stop offset="1" stop-color="#0E5F7A"/>
    </radialGradient>
    <radialGradient id="tip" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFF6CF"/><stop offset="0.6" stop-color="#FFC94D"/><stop offset="1" stop-color="#E08A1F"/>
    </radialGradient>
    <clipPath id="bodyClip"><ellipse cx="160" cy="156" rx="68" ry="54"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0B1236" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#soft)" transform="translate(2 6)">
    <!-- wings, behind -->
    <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.5">
      <ellipse cx="176" cy="78" rx="30" ry="46" transform="rotate(28 176 78)" fill="url(#wing)"/>
      <ellipse cx="140" cy="74" rx="28" ry="48" transform="rotate(-12 140 74)" fill="url(#wing)"/>
    </g>
    <path d="M132 50 Q140 74 142 100 M170 52 Q174 76 166 100" stroke="#A9C2FF" stroke-opacity="0.6" stroke-width="2" fill="none"/>

    <!-- stinger -->
    <path d="M222 150 L246 160 L222 170 Z" fill="#3F2BB5"/>
    <path d="M224 153 L238 159 L224 161 Z" fill="#8E7BFF" opacity="0.7"/>

    <!-- body with violet stripes -->
    <ellipse cx="160" cy="156" rx="68" ry="54" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <path d="M150 96 Q140 156 152 216 L176 216 Q164 156 174 96 Z" fill="url(#stripe)"/>
      <path d="M194 96 Q186 156 196 216 L216 216 Q206 156 214 96 Z" fill="url(#stripe)"/>
      <ellipse cx="146" cy="196" rx="70" ry="26" fill="#7A3A10" opacity="0.18"/>
    </g>
    <ellipse cx="146" cy="124" rx="34" ry="14" fill="#FFFFFF" opacity="0.45" transform="rotate(-10 146 124)"/>

    <!-- little legs -->
    <g stroke="#3F2BB5" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M140 204 q-4 12 -12 14"/><path d="M166 208 q0 12 -6 16"/><path d="M192 202 q4 12 0 18"/>
    </g>

    <!-- antennae with glowing tips -->
    <g stroke="#3F2BB5" stroke-width="4.5" stroke-linecap="round" fill="none">
      <path d="M76 80 Q62 52 40 46"/><path d="M100 76 Q102 46 88 28"/>
    </g>
    <circle cx="38" cy="45" r="9" fill="url(#tip)"/><circle cx="87" cy="27" r="9" fill="url(#tip)"/>
    <circle cx="35" cy="42" r="3" fill="#FFFFFF"/><circle cx="84" cy="24" r="3" fill="#FFFFFF"/>

    <!-- Lumi's pointed elf ear -->
    <path d="M40 132 L8 112 L40 154 Z" fill="url(#skin)" stroke="#9C90DA" stroke-width="1.5"/>
    <path d="M36 134 L18 121 L36 148 Z" fill="#F2A0C0" opacity="0.6"/>
    <!-- head -->
    <circle cx="88" cy="136" r="56" fill="url(#skin)"/>
    <!-- Lumi's violet swoop of hair as the bee's fuzz -->
    <path d="M36 128 C30 92 58 70 92 72 C122 74 142 92 144 120 C128 100 108 96 92 104 C76 92 54 100 36 128 Z" fill="url(#hair)"/>
    <path d="M58 92 C74 80 100 78 120 88" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- grumpy brows -->
    <g stroke="#2A1F7A" stroke-width="5" stroke-linecap="round">
      <path d="M48 118 L72 126"/><path d="M98 126 L122 116"/>
    </g>
    <!-- big teal eyes -->
    <g>
      <ellipse cx="64" cy="144" rx="15" ry="18" fill="#FFFFFF"/>
      <ellipse cx="62" cy="146" rx="11" ry="14" fill="url(#iris)"/>
      <ellipse cx="61" cy="147" rx="5" ry="7" fill="#0B1236"/>
      <circle cx="57" cy="140" r="4" fill="#FFFFFF"/><circle cx="66" cy="153" r="2" fill="#FFFFFF"/>
      <path d="M48 134 Q64 124 80 136" stroke="#1A1450" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M50 134 L44 129 M56 130 L52 124" stroke="#1A1450" stroke-width="3" stroke-linecap="round"/>

      <ellipse cx="108" cy="144" rx="15" ry="18" fill="#FFFFFF"/>
      <ellipse cx="106" cy="146" rx="11" ry="14" fill="url(#iris)"/>
      <ellipse cx="105" cy="147" rx="5" ry="7" fill="#0B1236"/>
      <circle cx="101" cy="140" r="4" fill="#FFFFFF"/><circle cx="110" cy="153" r="2" fill="#FFFFFF"/>
      <path d="M92 136 Q108 124 124 134" stroke="#1A1450" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M120 131 L127 127" stroke="#1A1450" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- blush and a little pout -->
    <ellipse cx="50" cy="168" rx="10" ry="6" fill="#FF8FB8" opacity="0.55"/>
    <ellipse cx="122" cy="168" rx="10" ry="6" fill="#FF8FB8" opacity="0.55"/>
    <path d="M78 176 Q86 170 94 176" stroke="#9C3F6E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- gloss on the cheek -->
    <ellipse cx="70" cy="104" rx="16" ry="7" fill="#FFFFFF" opacity="0.35" transform="rotate(-20 70 104)"/>
  </g>
</svg>
